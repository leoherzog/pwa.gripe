name: Deploy PWA Support Data

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub disables scheduled workflows after 60 days without repo activity; re-enabling resets that timer.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update-data.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - run: uv run build/build.py
      - run: mkdir _site && cp -r index.html app.js sw.js manifest.json icons screenshots _site/
      - uses: actions/upload-pages-artifact@v5
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
